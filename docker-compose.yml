version: '3.8'
services:
  mysql_login:
    image: mysql:8.0
    container_name: mysql_login
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: login
      MYSQL_USER: vcofre
      MYSQL_PASSWORD: vcofre123
    ports:
      - "3310:3306"
    volumes:
      - mysql_login_data:/var/lib/mysql
    deploy:
          resources:
            limits:
              memory: 512M
  mysql_car:
    image: mysql:8.0
    container_name: mysql_car
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: car
      MYSQL_USER: vcofre
      MYSQL_PASSWORD: vcofre123
    ports:
      - "3311:3306"
    volumes:
      - mysql_car_data:/var/lib/mysql
    deploy:
          resources:
            limits:
              memory: 512M
volumes:
  mysql_login_data:
  mysql_car_data:
